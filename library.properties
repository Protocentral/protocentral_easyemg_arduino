sentence=Arduino library for the ProtoCentral easyEMG single-channel surface EMG breakout board.
paragraph=Reads surface electromyography (sEMG) from the ProtoCentral easyEMG board over I2C. Gives you the raw band-limited muscle waveform in microvolts plus a built-in RMS envelope, muscle-activation detection, and %MVC normalisation. Standalone - no external dependencies. For research and education only - not a medical device.
